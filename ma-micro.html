<title>Ma Micro</title>
<style>

:root{
  color-scheme:dark;
  --bg:#0a0a0b;--card:#161617;--card2:#232325;--line:rgba(255,255,255,.07);
  --text:#f2f2ef;--text2:#a3a39c;--muted:#75756f;
  --accent:#8fd16a;
  --good:#0ca30c;--bad:#d03b3b;--warn:#fab219;--serious:#ec835a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
input,select,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
b{font-weight:650}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:flex-end;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;background:linear-gradient(var(--bg) 75%,rgba(10,10,11,0));max-width:640px;margin:0 auto}
.hello{font-size:13px;color:var(--text2)}
h1{margin:2px 0 0;font-size:31px;letter-spacing:-.025em;font-weight:760}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--text2)}
#view{padding:2px 16px calc(104px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px;position:relative}
.label{font-size:11.5px;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;font-weight:650}
.big{font-size:40px;font-weight:760;letter-spacing:-.035em;line-height:1.1;margin:6px 0 10px}
.mid{font-size:26px;font-weight:740;letter-spacing:-.03em;margin:4px 0 6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:650;background:var(--card2)}
.up{color:var(--good)}.down{color:var(--bad)}
.muted{color:var(--text2)}.faint{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 10px}
.sec h2{margin:0;font-size:20px;letter-spacing:-.015em;font-weight:720}
.link{color:var(--accent);font-weight:650;font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.right{text-align:right;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 15px;min-width:0}
.tile .v{font-size:21px;font-weight:720;letter-spacing:-.02em;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:12px;color:var(--text2);margin-top:2px}
.split{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--text2)}
.split b{color:var(--text);margin-left:4px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.seg{display:inline-flex;background:var(--card2);border-radius:10px;padding:3px}
.seg button{white-space:nowrap;padding:5px 11px;border-radius:8px;font-size:13px;font-weight:650;color:var(--text2)}
.seg button.on{background:#3b3b3e;color:var(--text)}
.chart{position:relative;margin-top:12px;touch-action:pan-y;min-height:40px}
.chart svg{display:block;overflow:visible}
svg text{fill:var(--muted);font-size:10.5px;font-family:inherit}
.tip{position:absolute;top:0;left:0;pointer-events:none;background:#2c2c2f;border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:7px 10px;font-size:12px;line-height:1.35;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;transition:opacity .12s;z-index:3;color:var(--text2)}
.tip b{color:var(--text);font-size:13.5px}
.tip .k{display:flex;align-items:center;gap:6px}
.empty-chart{border:1px dashed rgba(255,255,255,.12);border-radius:16px;padding:18px;text-align:center;color:var(--text2);font-size:13px;line-height:1.5}
.empty-chart svg{margin:0 auto 8px;display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:15px;background:var(--accent);color:#0a0a0b;font-weight:720;font-size:16px;width:100%}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.danger{background:rgba(208,59,59,.15);color:#ff8a8a}
.btn.sm{height:40px;font-size:14px;border-radius:12px}
.btns{display:flex;gap:10px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.act{display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 4px 11px;font-size:12px;font-weight:650;color:var(--text2)}
.act svg{color:var(--accent)}
.act:active,.card[data-act]:active,.tile[data-act]:active{transform:scale(.98);transition:transform .1s}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;padding:8px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(17,17,18,.84);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border-top:1px solid var(--line)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:650;color:var(--muted);padding:4px 0}
.tabbar button.on{color:var(--accent)}
.name{font-weight:700;font-size:16px;letter-spacing:-.01em}
.tick{font-size:12px;color:var(--muted);margin-left:7px;font-weight:550}
.lv{font-weight:720;font-size:17px;letter-spacing:-.01em}
.spark{width:100%;height:36px;display:block;margin:10px 0 2px}
.spark-empty{font-size:12px;color:var(--muted);margin:10px 0 2px;height:36px;display:flex;align-items:center}

.sheet-wrap{position:fixed;inset:0;z-index:50}

.mhead{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 8px}

.todo{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45;color:var(--text2)}

.ro{background:var(--card2);border-radius:14px;padding:4px 14px;margin-bottom:12px}
.ro .kv{border-top:1px solid var(--line)}.ro .kv:first-child{border-top:0}
.switch{position:relative;width:52px;height:32px;flex:none}

.switch span{position:absolute;inset:0;background:#3a3a3d;border-radius:16px;transition:.2s}

.prow{display:grid;grid-template-columns:1fr 1fr 34px;gap:8px;align-items:center;margin-bottom:8px}
.prow input{width:100%;height:46px;border-radius:12px;border:1px solid transparent;background:var(--card2);color:var(--text);font-size:16px;padding:0 10px;outline:none;font-family:inherit}

<script>
'use strict';
/* ============ utilitaires ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const KEY='micro.app.v1';
const LBN='La Boîte à Néon';
const SERIES=['#3987e5','#d95926','#199e70','#c98500'];
const z=n=>String(n).padStart(2,'0');
const iso=(d=new Date())=>`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
const mk=(d=new Date())=>`${d.getFullYear()}-${z(d.getMonth()+1)}`;
const uid=()=>Math.random().toString(36).slice(2,11);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=s=>{const v=parseFloat(String(s??'').replace(/[\s  €%h]/g,'').replace(',','.'));return isFinite(v)?v:0};
const r2=v=>Math.round(v*100)/100;
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const NF2=new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
const NF0=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
const NF1=new Intl.NumberFormat('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1});
const NFx=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2});
const eur=(v,d)=>{d=d??(Math.abs(v)>=10000?0:2);return (d?NF2:NF0).format(d?v:Math.round(v))+' €'};
const pct=(v,d=1)=>(d?NF1:NF0).format(v*100)+' %';
const short=v=>{const a=Math.abs(v);if(a>=1e3)return (a>=1e4?NF0.format(v/1e3):NF1.format(v/1e3)).replace(',0','')+' k';return NF0.format(v)};
const MONTHS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MONTHS_L=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const DAYS=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
const DAYS_L=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const mName=m=>MONTHS_L[+m.slice(5)-1]+' '+m.slice(0,4);
const mNameC=m=>{const s=mName(m);return s.charAt(0).toUpperCase()+s.slice(1)};
const mShort=m=>MONTHS[+m.slice(5)-1]+' '+m.slice(2,4);
const addM=(m,k)=>mk(new Date(+m.slice(0,4),+m.slice(5)-1+k,1));
const daysIn=m=>new Date(+m.slice(0,4),+m.slice(5),0).getDate();
const dObj=d=>new Date(d+'T12:00:00');
const dayLabel=d=>{const x=dObj(d);return `${DAYS[x.getDay()]} ${x.getDate()} ${MONTHS[x.getMonth()]}`};
const dayLabelL=d=>{const x=dObj(d);return `${DAYS_L[x.getDay()]} ${x.getDate()} ${MONTHS_L[x.getMonth()]}`};
const frDate=d=>d?`${d.slice(8,10)}/${d.slice(5,7)}/${d.slice(0,4)}`:'';
const hm2min=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+(m||0)};
const min2hm=n=>{n=((Math.round(n)%1440)+1440)%1440;return z(Math.floor(n/60))+':'+z(n%60)};
const segH=s=>{if(!s.s||!s.e)return 0;let d=hm2min(s.e)-hm2min(s.s);if(d<0)d+=1440;return d/60};
const sessH=x=>sum(x.segs,segH);
const roundQ=t=>min2hm(Math.round(hm2min(t)/15)*15);
const hmOf=ms=>{const d=new Date(ms);return z(d.getHours())+':'+z(d.getMinutes())};
const nowHM=()=>{const d=new Date();return z(d.getHours())+':'+z(d.getMinutes())};
const hTxt=h=>{const t=Math.round(h*60),hh=Math.floor(t/60),mm=t%60;return mm?`${hh} h ${z(mm)}`:`${hh} h`};
const segTxt=x=>x.segs.filter(s=>s.s&&s.e).map(s=>`${s.s.replace(':','h')}–${s.e.replace(':','h')}`).join(' · ');

function ensureLbnInvoices(){

    S.invoices.push({id:uid(),m,client:LBN,lines:[],tva:tvaRate(m),number:null,sent:false,sentAt:null,paid:false,paidAt:null,lbn:m})});
}

function yearStats(y){const ms=[...Array(12)].map((_,k)=>`${y}-${z(k+1)}`).filter(m=>m<=mk());const rows=ms.map(m=>({m,...monthStats(m)}));return {rows,ht:sum(rows,r=>r.ht),lbn:sum(rows,r=>r.lbn),tva:sum(rows,r=>r.tva),ur:sum(rows,r=>r.ur),net:sum(rows,r=>r.net)}}

function periodsToDeclare(){
  const out=[],cur=mk(),q=S.settings.declare==='trimestrielle';
  const first=S.invoices.reduce((a,i)=>!a||i.m<a?i.m:a,null)||cur;
  if(!q){for(let m=first;m<cur;m=addM(m,1)){const st=monthStats(m);out.push({key:m,label:mName(m),months:[m],ht:st.ht,ur:st.ur,due:iso(new Date(+addM(m,1).slice(0,4),+addM(m,1).slice(5),0))})}}
  else{let y=+first.slice(0,4),qq=Math.floor((+first.slice(5)-1)/3);for(;;){const m0=`${y}-${z(qq*3+1)}`,m2=`${y}-${z(qq*3+3)}`;if(m2>=cur)break;const months=[m0,addM(m0,1),m2],ht=sum(months,m=>monthStats(m).ht),ur=sum(months,m=>monthStats(m).ur),dm=addM(m2,1);out.push({key:`${y}-T${qq+1}`,label:`${qq+1}${qq?'e':'er'} trimestre ${y}`,months,ht,ur,due:iso(new Date(+dm.slice(0,4),+dm.slice(5),0))});qq++;if(qq>3){qq=0;y++}}}
  return out.filter(p=>!S.settings.declared[p.key]);
}

function niceStep(range,count){if(range<=0)return 1;const raw=range/count,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return (f<1.5?1:f<3?2:f<7?5:10)*p}
function lineChart(el,labels,series,o={}){
  const W=Math.max(260,el.clientWidth||320),H=o.h||180,pl=o.pl??44,pr=o.pr??12,pt=14,pb=24;
  const n=labels.length,all=series.flatMap(s=>s.values);
  let mn=Math.min(...all),mx=Math.max(...all);
  if(o.zero)mn=0;
  if(mx===mn){mx=mx*1.1||1;if(!o.zero)mn=mn*0.9}
  else if(!o.zero){const p=(mx-mn)*.18;mn=Math.max(0,mn-p);mx+=p*.5}
  const st=niceStep(mx-mn,3);mn=Math.floor(mn/st)*st;mx=Math.ceil(mx/st)*st;
  const iw=W-pl-pr,ih=H-pt-pb;
  const X=i=>pl+(n<=1?iw/2:i*iw/(n-1)),Y=v=>pt+(1-(v-mn)/((mx-mn)||1))*ih;
  let g='';
  for(let v=mn;v<=mx+st/2;v+=st){const y=Y(v).toFixed(1);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,${v===mn?.12:.06})"/><text x="${pl-8}" y="${+y+3.5}" text-anchor="end">${short(v)}</text>`}
  const k=Math.min(n,o.xticks||4);

  let body='';
  series.forEach(s=>{
    const d=s.values.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
    if(s.area){const gid='g'+uid();body+=`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".30"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${X(n-1).toFixed(1)},${Y(mn).toFixed(1)}L${X(0).toFixed(1)},${Y(mn).toFixed(1)}Z" fill="url(#${gid})"/>`}
    body+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dash?' stroke-dasharray="4 5"':''}/>`;
  });
  if(o.endDot)series.forEach(s=>{if(!s.dash)body+=`<circle cx="${X(n-1).toFixed(1)}" cy="${Y(s.values[n-1]).toFixed(1)}" r="4.5" fill="${s.color}" stroke="#161617" stroke-width="2"/>`});
  if(o.direct){const lab=series.map(s=>({s,y:Y(s.values[n-1])})).sort((a,b)=>a.y-b.y);for(let i=1;i<lab.length;i++)if(lab[i].y-lab[i-1].y<14)lab[i].y=lab[i-1].y+14;lab.forEach(l=>{body+=`<text x="${W-pr+8}" y="${(l.y+3.5).toFixed(1)}" style="fill:var(--text2);font-weight:650;font-size:11px">${l.s.name}</text>`})}
  const hov=`<line class="xh" y1="${pt}" y2="${H-pb}" stroke="rgba(255,255,255,.35)" stroke-width="1" style="opacity:0"/>`+series.map((s,i)=>`<circle class="hd" r="5" fill="${s.color}" stroke="#161617" stroke-width="2" style="opacity:0"/>`).join('');
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'Graphique')}">${g}${body}${hov}<rect x="${pl-6}" y="0" width="${iw+12}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  const svg=el.querySelector('svg'),tip=el.querySelector('.tip'),xh=svg.querySelector('.xh'),dots=$$('.hd',svg);
  let tmr;
  const show=cx=>{clearTimeout(tmr);const r=svg.getBoundingClientRect();let i=n<=1?0:Math.round((cx-r.left-pl)/iw*(n-1));i=Math.max(0,Math.min(n-1,i));const px=X(i);
    xh.setAttribute('x1',px);xh.setAttribute('x2',px);xh.style.opacity=1;

function barPath(x,y,w,h,r){r=Math.min(r,w/2,h);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}
function bars(el,items,o={}){

  const W=Math.max(260,el.clientWidth||320),H=o.h||170,pl=40,pr=6,pt=12,pb=22,iw=W-pl-pr,ih=H-pt-pb,n=items.length;
  let mx=Math.max(0,...items.map(d=>sum(d.parts,p=>p.v)));if(mx<=0)mx=100;const st=niceStep(mx,3);mx=Math.ceil(mx/st)*st;
  const Y=v=>pt+ih-(v/mx)*ih,slot=iw/n,bw=Math.min(24,slot*.62);
  let g='';for(let v=0;v<=mx+st/2;v+=st){const y=Y(v).toFixed(1);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,${v?0.06:.14})"/><text x="${pl-8}" y="${+y+3.5}" text-anchor="end">${short(v)}</text>`}

  let b='';items.forEach((d,i)=>{const x=pl+i*slot+(slot-bw)/2;let base=0;const vis=d.parts.filter(p=>p.v>0);vis.forEach((p,k)=>{const y0=Y(base),y1=Y(base+p.v),gap=k>0?2:0,h=Math.max(0,y0-y1-gap);if(h>0.4){const top=k===vis.length-1;b+=`<path class="bar" data-i="${i}" d="${top?barPath(x,y1,bw,h,4):`M${x},${y1}h${bw}v${h}h${-bw}Z`}" fill="${p.color}" opacity="${d.cur?1:.68}"/>`}base+=p.v});
    const showL=n<=14||i%Math.ceil(n/12)===0||d.cur;b+=`${showL?`<text x="${(x+bw/2).toFixed(1)}" y="${H-5}" text-anchor="middle" ${d.cur?'style="fill:var(--text);font-weight:700"':''}>${d.l}</text>`:''}<rect class="hitb" data-i="${i}" x="${pl+i*slot}" y="0" width="${slot}" height="${H}" fill="transparent"/>`});
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'Histogramme')}">${g}${b}</svg><div class="tip"></div>`;

}

function comptaCard(){const ys=[...new Set(S.invoices.filter(i=>i.sent).map(i=>i.m.slice(0,4)))].sort().reverse();if(!ys.length)return '';const y=ys.includes(UI.cy)?UI.cy:ys[0];

function livreCSV(y){
  const rows=S.invoices.filter(i=>i.sent&&i.paid).map(i=>({i,d:i.paidAt||i.sentAt||iso(new Date(+i.m.slice(0,4),+i.m.slice(5),0))})).filter(x=>x.d.slice(0,4)===y).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  const f=v=>r2(v).toFixed(2).replace('.',','),q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const out=[["Date d'encaissement",'N° de facture','Client','Nature de la prestation','Montant HT','TVA','Montant TTC','Mode de règlement'],
    ...rows.map(({i,d})=>[frDate(d),i.number||'',clientInfo(i.client).legalName||i.client,(invLines(i)[0]||{}).label||'Prestation de services',f(invHT(i)),f(invTVA(i)),f(invTTC(i)),'Virement']),

  if(!rows.length)return toast('Aucune facture encaissée en '+y);
  dl(new Blob(['\ufeff'+out.map(r=>r.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),`Livre-des-recettes-${y}.csv`);toast('Livre des recettes '+y+' ✓')}

  async get(k){try{const db=await this.open();return await new Promise(res=>{const q=db.transaction('h').objectStore('h').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}},
  async set(k,v){try{const db=await this.open();await new Promise(res=>{const q=db.transaction('h','readwrite').objectStore('h').put(v,k);q.onsuccess=q.onerror=()=>res()})}catch(e){}}};

  closeSheet:()=>closeSheet(),settings:()=>openSettings(),
  tab:(id,el)=>{UI.tab=el.dataset.v;closeSheet();render();window.scrollTo(0,0)},
  prevM:()=>{UI.m=addM(UI.m,-1);UI.showSales=false;render()},nextM:()=>{if(UI.m<mk()){UI.m=addM(UI.m,1);UI.showSales=false;render()}},
  yearPrev:()=>{UI.year--;render()},yearNext:()=>{if(UI.year<new Date().getFullYear()){UI.year++;render()}},
  period:(id,el)=>{UI.period=el.dataset.v;render()},
  metric:(id,el)=>{UI.metric=el.dataset.v;render()},
  openNeonM:(id,el)=>{UI.m=el.dataset.v;UI.tab='neon';render();window.scrollTo(0,0)},
  filter:(id,el)=>{UI.filter=el.dataset.v;UI.tab='factures';render()},goUnpaid:()=>{UI.filter='unpaid';UI.tab='factures';render();window.scrollTo(0,0)},moreInv:()=>{UI.invLimit+=6;render()},
  toggleSales:()=>{UI.showSales=!UI.showSales;render()},
  declared:(id,el)=>{S.settings.declared[el.dataset.v]=iso();commit('Déclaration notée ✓')},
  /* chrono */
  tStart:()=>{const n=Date.now();S.timer={start:n,startDay:n,date:iso(),segs:[],paused:false};commit('Atelier démarré ⏱️')},
  tPause:()=>{const T=S.timer;if(!T||T.paused)return;T.segs.push({s:hmOf(T.start),e:nowHM()});T.paused=true;commit('En pause')},
  tResume:()=>{const T=S.timer;if(!T)return;T.start=Date.now();T.paused=false;commit('C’est reparti')},
  tStop:()=>{const T=S.timer;if(!T)return;const segs=T.segs.slice();if(!T.paused)segs.push({s:hmOf(T.start),e:nowHM()});
    const rs=S.settings.round15?segs.map(s=>({s:roundQ(s.s),e:roundQ(s.e)})):segs;openSession(null,{d:T.date,segs:rs.filter(s=>segH(s)>0).length?rs.filter(s=>segH(s)>0):rs})},
  tCancel:()=>{if(!confirm('Annuler le chrono en cours ? Rien ne sera enregistré.'))return;S.timer=null;commit('Chrono annulé')},
  /* journées */
  newSession:()=>openSession(),editSession:id=>openSession(id),
  addSeg:()=>{const box=$('#segs'),segs=readSegs(),last=segs[segs.length-1]||{};box.insertAdjacentHTML('beforeend',segRow({s:last.e?min2hm(hm2min(last.e)+60):'',e:''},segs.length));},
  delSeg:(id,el)=>{const i=+el.dataset.v,segs=readSegs();segs.splice(i,1);$('#segs').innerHTML=segs.map(segRow).join('');const w=$('#sheet .panel');w&&w._upd&&w._upd()},
  saveSession:(id,el)=>{const d=fv$('d'),segs=readSegs().filter(s=>s.s&&s.e);if(!d)return toast('Choisis le jour');if(!segs.length)return toast('Indique au moins un début et une fin');
    let x=id?S.sessions.find(y=>y.id===id):null;if(!x){x={id:uid()};S.sessions.push(x)}Object.assign(x,{d,segs,note:fv$('note').trim()});lbnM(d.slice(0,7),true);
    if(el&&el.dataset.v==='timer')S.timer=null;UI.m=d.slice(0,7);closeSheet();commit(`${hTxt(sum(segs,segH))} d’atelier enregistrées ✓`)},
  delSession:id=>{if(!confirm('Supprimer cette journée ?'))return;S.sessions=S.sessions.filter(x=>x.id!==id);closeSheet();commit('Journée supprimée')},
  /* néon */
  newSale:()=>openSale(),editSale:id=>openSale(id),monthInfo:()=>openMonthInfo(),
  avis:(id,el)=>{const M=lbnM(UI.m,true),k=el.dataset.k;M[k]=Math.max(0,(+M[k]||0)+(+el.dataset.v));commit(+el.dataset.v>0?'Avis ajouté ⭐':null)},
  saveSale:(id,el)=>{const a=num(fv$('amount'));if(a<=0)return toast('Indique un montant');const M=lbnM(UI.m,true);let s=id?M.sales.find(x=>x.id===id):null;if(!s){s={id:uid()};M.sales.push(s)}Object.assign(s,{amount:r2(a),qty:Math.max(1,Math.round(num(fv$('qty'))||1)),d:fv$('d'),label:fv$('label').trim()});save();render();
    if(el.dataset.v==='again'){openSale();toast(`Vente de ${eur(a,0)} ajoutée ✓`)}else{closeSheet();toast(id?'Vente modifiée':`Vente de ${eur(a,0)} ajoutée ✓`)}},
  delSale:id=>{if(!confirm('Supprimer cette vente ?'))return;const M=lbnM(UI.m,true);M.sales=M.sales.filter(x=>x.id!==id);closeSheet();commit('Vente supprimée')},
  saveMonthInfo:()=>{const M=lbnM(UI.m,true),cc=fv$('companyCA').trim();M.bonus=num(fv$('bonus'));M.companyCA=cc?num(cc):null;M.hoursAdj=parseFloat(String(fv$('hoursAdj')).replace(',','.').replace('−','-'))||0;M.rules={rate:num(fv$('rate')),avis:num(fv$('avis')),hourly:num(fv$('hourly'))};closeSheet();commit('Mois mis à jour')},
  recapPdf:async(id,el)=>{const m=el.dataset.v||UI.m;try{await sharePDF(recapPDF(m))}catch(e){toast('Erreur PDF : '+e.message)}},
  lbnPdf:async(id,el)=>{const m=el.dataset.v||UI.m;try{await sharePDF(lbnPDF(m))}catch(e){toast('Erreur PDF : '+e.message)}},
  /* factures */
  newInv:()=>openInvoice(),openInv:id=>openInvoice(id),
  addLine:()=>{const box=$('#lines');box.insertAdjacentHTML('beforeend',invLineRow({label:'',ht:''},box.children.length))},
  delLine:(id,el)=>{const r=el.closest('.line-row');if($$('#lines .line-row').length>1)r.remove();else{$$('input',r).forEach(x=>x.value='')}const w=$('#sheet .panel');w&&w.dispatchEvent(new Event('input'))},
  saveInv:id=>{let i=id?S.invoices.find(x=>x.id===id):null;const m=fv$('m');if(!/^\d{4}-\d{2}$/.test(m))return toast('Choisis le mois');
    if(!i||!isDraftLbn(i)){const client=fv$('client').trim(),lines=readLines();if(!client)return toast('Indique le client');if(!lines.length)return toast('Ajoute au moins une ligne');if(!i){i={id:uid(),sent:false,paid:false,number:null,sentAt:null,paidAt:null,lbn:null};S.invoices.push(i)}Object.assign(i,{client,lines})}
    i.m=m;i.tva=num(fv$('tva'));if(id){i.number=fv$('number').trim()||null;i.sentAt=fv$('sentAt')||null;i.paidAt=fv$('paidAt')||null;if(i.sentAt&&!i.sent){freezeLbn(i);i.sent=true}if(i.paidAt){i.paid=true;i.sent=true}}
    if(!S.clients[i.client])S.clients[i.client]={address:''};if(!isDraftLbn(i)&&$('#sheet [name="csiren"]')){S.clients[i.client].siren=fv$('csiren').trim();S.clients[i.client].address=fv$('caddr').trim()}closeSheet();commit('Facture enregistrée ✓')},
  markSent:id=>{const i=S.invoices.find(x=>x.id===id);freezeLbn(i);i.sent=true;i.sentAt=iso();if(!i.number)i.number=nextNumber(new Date().getFullYear());closeSheet();commit(`Facture ${i.number} envoyée 📤`)},
  markPaid:id=>{const i=S.invoices.find(x=>x.id===id);i.paid=true;i.paidAt=iso();closeSheet();commit('Paiement reçu ✓')},
  delInv:id=>{const i=S.invoices.find(x=>x.id===id);if(!confirm(i.lbn&&!i.sent?'Supprimer ce brouillon ? Il sera recréé automatiquement tant qu’il y a de l’activité néon ce mois-là.':'Supprimer cette facture ?'))return;S.invoices=S.invoices.filter(x=>x.id!==id);if(i.lbn&&!i.sent){i.lbn=null}closeSheet();commit('Facture supprimée')},
  invPdf:async id=>{const i=S.invoices.find(x=>x.id===id);try{await sharePDF(invoicePDF(i))}catch(e){toast('Erreur PDF : '+e.message)}},
  /* réglages */
  addPeriod:(id,el)=>{const k=el.dataset.k,box=$(k==='u'?'#urssafRows':'#tvaRows');box.insertAdjacentHTML('beforeend',`<div class="prow" data-${k}="${box.children.length}"><input type="month" data-k="from" value="${mk()}"><input data-k="rate" inputmode="decimal" value="${k==='u'?'23':'20'}" style="text-align:right"><button class="del" data-act="delPeriod" aria-label="Retirer">✕</button></div>`)},
  delPeriod:(id,el)=>el.closest('.prow').remove(),
  saveSettings:()=>{const P=S.profile;['name','company','siret','email','phone','mentions','tvaNum','rne','status','bic','iban'].forEach(k=>P[k]=fv$(k).trim());P.payDays=num(fv$('payDays'))||30;P.debits=$('#sheet [name="debits"]').checked;P.address=$('#sheet [name="address"]').value.trim();S.clients[LBN]={...(S.clients[LBN]||{}),address:$('#sheet [name="lbnAddr"]').value.trim(),siren:fv$('lbnSiren').trim(),legalName:fv$('lbnLegal').trim(),contact:fv$('lbnContact').trim(),tvaNum:fv$('lbnTva').trim()};S.settings.attachSales=$('#sheet [name="attachSales"]').checked;S.settings.lastNumber=fv$('lastNumber').trim();
    const T=S.settings;T.lbnRules={rate:num(fv$('rate')),avis:num(fv$('avis')),hourly:num(fv$('hourly'))};if($('#sheet [name="applyCur"]').checked)lbnM(mk(),true).rules={...T.lbnRules};
    T.round15=$('#sheet [name="round15"]').checked;T.urssaf=readPeriods('u');if(!T.urssaf.length)T.urssaf=[{from:'2025-01',rate:23}];T.tva=readPeriods('t');T.declare=fv$('declare');
    T.goalNet=num(fv$('goalNet'));T.plafond=num(fv$('plafond'))||83600;T.seuilTva=num(fv$('seuilTva'))||37500;T.seuilTvaMaj=num(fv$('seuilTvaMaj'))||41250;closeSheet();commit('Réglages enregistrés')},
  update:()=>checkUpdate(true),cy:(_,el)=>{UI.cy=el.dataset.v;render()},livre:(_,el)=>livreCSV(el.dataset.v),allPdf:(_,el)=>allPdf(el.dataset.v),
  export:async()=>{const name=`ma-micro-${iso()}.json`,file=new File([JSON.stringify(S,null,1)],name,{type:'application/json'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Sauvegarde Ma Micro'});return}}catch(e){if(e.name==='AbortError')return}const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove()},
  import:()=>$('#importFile').click(),
  reset:()=>{if(!confirm('Effacer toutes tes données ? (fais d’abord une sauvegarde)'))return;if(!confirm('Vraiment tout effacer ?'))return;S=seed();closeSheet();commit('Données effacées')}
};
function freezeLbn(i){if(i&&i.lbn&&!i.sent)i.lines=lbnLines(i.lbn)}
Object.assign(ACT,SY_ACT);
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t&&t.closest('.tabbar')){UI.tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  const a=e.target.closest('[data-act]');if(!a||a.matches('input,select,label,textarea'))return;
  const f=ACT[a.dataset.act];if(f){e.preventDefault();f(a.dataset.id,a,e)}
});
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(f)syImportFile(f);e.target.value=''});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){render()}});

(function init(){
  S=load()||seed();normalize();ensureLbnInvoices();syInit();save();
  const d=new Date(),hs=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});$('#hello').textContent=hs.charAt(0).toUpperCase()+hs.slice(1);
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if(S.timer)UI.tab='atelier';
  render();checkUpdate();
  let rw=window.innerWidth,rt;window.addEventListener('resize',()=>{if(window.innerWidth===rw)return;rw=window.innerWidth;clearTimeout(rt);rt=setTimeout(render,150)});
})();
</script>
