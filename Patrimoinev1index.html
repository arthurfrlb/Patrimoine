<title>Patrimoine</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0a0a0b;--card:#161617;--card2:#232325;--line:rgba(255,255,255,.07);
  --text:#f2f2ef;--text2:#a3a39c;--muted:#75756f;
  --accent:#8fd16a;
  --good:#0ca30c;--bad:#d03b3b;--warn:#fab219;--serious:#ec835a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
input,select,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
b{font-weight:650}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:flex-end;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;background:linear-gradient(var(--bg) 75%,rgba(10,10,11,0));max-width:640px;margin:0 auto}
.hello{font-size:13px;color:var(--text2)}
h1{margin:2px 0 0;font-size:31px;letter-spacing:-.025em;font-weight:760}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--text2)}
#view{padding:2px 16px calc(104px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px;position:relative}
.label{font-size:11.5px;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;font-weight:650}
.big{font-size:40px;font-weight:760;letter-spacing:-.035em;line-height:1.1;margin:6px 0 10px}
.mid{font-size:26px;font-weight:740;letter-spacing:-.03em;margin:4px 0 6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:650;background:var(--card2)}
.up{color:var(--good)}.down{color:var(--bad)}
.muted{color:var(--text2)}.faint{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 10px}
.sec h2{margin:0;font-size:20px;letter-spacing:-.015em;font-weight:720}
.link{color:var(--accent);font-weight:650;font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.right{text-align:right;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 15px;min-width:0}
.tile .v{font-size:21px;font-weight:720;letter-spacing:-.02em;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:12px;color:var(--text2);margin-top:2px}
.split{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--text2)}
.split b{color:var(--text);margin-left:4px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.seg{display:inline-flex;background:var(--card2);border-radius:10px;padding:3px}
.seg button{white-space:nowrap;padding:5px 11px;border-radius:8px;font-size:13px;font-weight:650;color:var(--text2)}
.seg button.on{background:#3b3b3e;color:var(--text)}
.chart{position:relative;margin-top:12px;touch-action:pan-y;min-height:40px}
.chart svg{display:block;overflow:visible}
svg text{fill:var(--muted);font-size:10.5px;font-family:inherit}
.tip{position:absolute;top:0;left:0;pointer-events:none;background:#2c2c2f;border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:7px 10px;font-size:12px;line-height:1.35;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;transition:opacity .12s;z-index:3;color:var(--text2)}
.tip b{color:var(--text);font-size:13.5px}
.tip .k{display:flex;align-items:center;gap:6px}
.empty-chart{border:1px dashed rgba(255,255,255,.12);border-radius:16px;padding:18px;text-align:center;color:var(--text2);font-size:13px;line-height:1.5}
.empty-chart svg{margin:0 auto 8px;display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:15px;background:var(--accent);color:#0a0a0b;font-weight:720;font-size:16px;width:100%}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.danger{background:rgba(208,59,59,.15);color:#ff8a8a}
.btn.sm{height:40px;font-size:14px;border-radius:12px}
.btns{display:flex;gap:10px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.act{display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 4px 11px;font-size:12px;font-weight:650;color:var(--text2)}
.act svg{color:var(--accent)}
.act:active,.card[data-act]:active,.tile[data-act]:active{transform:scale(.98);transition:transform .1s}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;padding:8px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(17,17,18,.84);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border-top:1px solid var(--line)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:650;color:var(--muted);padding:4px 0}
.tabbar button.on{color:var(--accent)}
.name{font-weight:700;font-size:16px;letter-spacing:-.01em}
.tick{font-size:12px;color:var(--muted);margin-left:7px;font-weight:550}
.lv{font-weight:720;font-size:17px;letter-spacing:-.01em}
.spark{width:100%;height:36px;display:block;margin:10px 0 2px}
.spark-empty{font-size:12px;color:var(--muted);margin:10px 0 2px;height:36px;display:flex;align-items:center}
.track{position:relative;height:8px;background:var(--card2);border-radius:4px;margin:12px 0 8px}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:4px}
.target{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;background:var(--text);border-radius:2px;box-shadow:0 0 0 2px var(--card)}
.status{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;color:var(--text2)}
.status i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.legend{margin-top:14px}
.lg{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 2px;border-top:1px solid var(--line);font-size:14px}
.lg:first-child{border-top:0}
.lg .p{color:var(--text2);font-size:13px;min-width:48px;text-align:right}
.lg .vv{font-weight:650;min-width:84px;text-align:right}
.donut-wrap{position:relative;width:176px;height:176px;margin:4px auto 0}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:0 40px}
.dc .a{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dc .b{font-size:19px;font-weight:740;letter-spacing:-.02em}
.dc .c{font-size:12px;color:var(--text2)}
.goal{display:flex;gap:16px;align-items:center}
.goal .rw{position:relative;flex:none}
.goal .rp{position:absolute;inset:0;display:grid;place-items:center;font-weight:740;font-size:17px}
.ins{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45;color:var(--text2)}
.ins:first-child{border-top:0;padding-top:2px}
.ins b{color:var(--text)}
.ins .e{font-size:18px;line-height:1.2}
.av{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:760;font-size:14px;flex:none}
.rb-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 0;border-top:1px solid var(--line);align-items:center}
.rb-row .n{font-weight:650}
.rb-row .q{font-weight:720;text-align:right}
.rb-tot{display:flex;justify-content:space-between;padding:12px 0 4px;border-top:1px solid rgba(255,255,255,.14);font-size:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--text2);margin:12px 0}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 4px 10px;text-align:center}
.badge .e{font-size:26px;filter:grayscale(1);opacity:.28;line-height:1.2}
.badge.on{border-color:rgba(143,209,106,.35);background:linear-gradient(180deg,rgba(143,209,106,.10),var(--card))}
.badge.on .e{filter:none;opacity:1}
.badge .t{font-size:11px;font-weight:650;margin-top:5px;color:var(--muted)}
.badge.on .t{color:var(--text)}
.flame{font-size:46px;line-height:1}
.mv{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.mv:first-child{border-top:0}
.del{width:30px;height:30px;border-radius:50%;background:var(--card2);color:var(--muted);font-size:14px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin:6px 4px 0}
.cta{border:1px dashed rgba(143,209,106,.4);background:rgba(143,209,106,.05);border-radius:20px;padding:18px;text-align:center;color:var(--text2);font-size:14px;margin-bottom:12px}
.cta b{color:var(--accent)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:7px;box-shadow:0 0 0 3px rgba(12,163,12,.2)}
.live.off{background:var(--muted);box-shadow:none}
.code{background:var(--card2);border-radius:12px;padding:10px 12px;font:13px/1.6 ui-monospace,Menlo,monospace;color:var(--text);overflow-x:auto;white-space:pre;margin:8px 0 10px;-webkit-user-select:text;user-select:text}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;color:var(--text2)}
.kv b{color:var(--text)}
/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-wrap[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.62);opacity:0;transition:opacity .25s}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:#141415;border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:8px 18px calc(26px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.85,.2,1);max-width:640px;margin:0 auto;-webkit-overflow-scrolling:touch}
.open .backdrop{opacity:1}.open .panel{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#3a3a3d;margin:4px auto 12px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-head h3{margin:0;font-size:21px;letter-spacing:-.015em}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--text2);margin:0 4px 6px}
.field input,.field select{width:100%;height:50px;border-radius:14px;border:1px solid transparent;background:var(--card2);color:var(--text);font-size:17px;padding:0 14px;outline:none;-webkit-appearance:none;appearance:none;font-family:inherit}
.field input:focus,.field select:focus{border-color:var(--accent)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hr{height:1px;background:var(--line);margin:18px 0}
.sh-sub{font-size:13px;font-weight:700;color:var(--text2);letter-spacing:.05em;text-transform:uppercase;margin:18px 4px 10px}
.pr-row{display:grid;grid-template-columns:1fr 128px;gap:10px;align-items:center;margin-bottom:8px}
.pr-row input{height:46px;border-radius:12px;border:1px solid transparent;background:var(--card2);color:var(--text);font-size:17px;padding:0 12px;outline:none;width:100%;text-align:right;font-family:inherit}
.pr-row input:focus{border-color:var(--accent)}
.steps{margin:0;padding-left:20px;color:var(--text2);line-height:1.6;font-size:15px}
.steps b{color:var(--text)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:#f2f2ef;color:#0a0a0b;font-weight:650;padding:10px 16px;border-radius:999px;opacity:0;transition:.25s;z-index:70;font-size:14px;pointer-events:none;max-width:88vw;text-align:center;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>

<script>
'use strict';
/* ---------- utilitaires ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const KEY='patrimoine.app.v1';
const SERIES=['#3987e5','#d95926','#199e70','#c98500','#d55181','#0ca30c','#9085e9','#e66767'];
const OTHER='#6c6c66';
const z=n=>String(n).padStart(2,'0');
const iso=(d=new Date())=>`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
const mk=(d=new Date())=>`${d.getFullYear()}-${z(d.getMonth()+1)}`;
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=s=>{const v=parseFloat(String(s??'').replace(/[\s  €%]/g,'').replace(',','.'));return isFinite(v)?v:0};
const r2=v=>Math.round(v*100)/100;
const NF2=new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
const NF0=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
const NF1=new Intl.NumberFormat('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1});
const NFq=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:4});
const eur=(v,d)=>{d=d??(Math.abs(v)>=10000?0:2);return (d?NF2:NF0).format(d?v:Math.round(v))+' €'};
const sgn=v=>v>0?'+':v<0?'−':'';
const eurS=(v,d)=>sgn(r2(v))+eur(Math.abs(v),d);
const pct=(v,d=1)=>(d?NF1:NF0).format(v*100)+' %';
const pctS=v=>sgn(Math.round(v*1000)/1000)+pct(Math.abs(v));
const pts=v=>sgn(Math.round(v*1000)/1000)+NF1.format(Math.abs(v*100))+' pt';
const short=v=>{const a=Math.abs(v);if(a>=1e6)return NF1.format(v/1e6)+' M';if(a>=1e3)return (a>=1e4?NF0.format(v/1e3):NF1.format(v/1e3)).replace(',0','')+' k';return NF0.format(v)};
const MONTHS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MONTHS_L=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const mLabel=m=>{const [y,mo]=m.split('-');return MONTHS[+mo-1]+' '+y.slice(2)};
const dLabel=d=>{const [y,m,dd]=d.split('-');return `${+dd} ${MONTHS[+m-1]} ${y}`};
const monthsBetween=(a,b)=>(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
const ageTxt=m=>{const y=Math.floor(m/12),r=m%12;return [y?`${y} an${y>1?'s':''}`:'',r?`${r} mois`:''].filter(Boolean).join(' ')||'moins d’un mois'};

/* ---------- cours automatiques (onglet Google Sheets publié en CSV) ---------- */
const normT=t=>String(t||'').trim().toUpperCase().split(':').pop().trim();
const sheetT=t=>{t=String(t||'').trim().toUpperCase();return t.includes(':')?t:'EPA:'+t};
function parsePrice(v){let x=String(v||'').replace(/[^\d,.\-]/g,'');if(!x)return 0;if(x.includes(',')&&x.includes('.')){x=x.lastIndexOf(',')>x.lastIndexOf('.')?x.replace(/\./g,'').replace(',','.'):x.replace(/,/g,'')}else x=x.replace(',','.');const n=parseFloat(x);return isFinite(n)?n:0}
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows}
let fetching=false;
async function fetchPrices(manual){
  const url=(S.settings&&S.settings.priceUrl||'').trim();
  if(!url){if(manual)toast('Connecte d’abord ton Google Sheet');return null}
  if(fetching)return null;fetching=true;
  try{
    const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('http '+r.status);
    const txt=await r.text();if(/<html|<!doctype/i.test(txt.slice(0,300)))throw new Error('pas un CSV');
    const map={};parseCSV(txt).forEach(row=>{if(row.length<2)return;const k=normT(row[0]),p=parsePrice(row[1]);if(k&&p>0)map[k]=p});
    let n=0;const miss=[];
    S.pea.lines.forEach(l=>{const p=map[normT(l.ticker)];if(p){l.price=p;recordPrice(l,p);n++}else miss.push(l.name)});
    S.settings.lastFetch=Date.now();save();
    if(manual)toast(n?`Cours mis à jour ✓ (${n}/${S.pea.lines.length})`:'Aucun ticker reconnu dans le Sheet');
    return {n,miss,found:Object.keys(map).length};
  }catch(e){if(manual)toast('Cours indisponibles : vérifie le lien ou ta connexion');return {error:String(e.message||e)}}
  finally{fetching=false}
}
const fetchTxt=()=>{const t=S.settings&&S.settings.lastFetch;if(!t)return 'pas encore synchronisé';const d=new Date(t),now=new Date();const hm=`${z(d.getHours())}:${z(d.getMinutes())}`;return iso(d)===iso(now)?`mis à jour à ${hm}`:`mis à jour le ${dLabel(iso(d))} à ${hm}`};

/* ---------- types de comptes (taux en vigueur au 15/11/2026) ---------- */
const TYPES={
  livretA:{label:'Livret A',group:'reg',rate:1.7,ceiling:22950},
  ldds:{label:'LDDS',group:'reg',rate:1.7,ceiling:12000},
  lep:{label:'LEP',group:'reg',rate:2.5,ceiling:10000},
  jeune:{label:'Livret Jeune',group:'reg',rate:1.7,ceiling:1600},
  cel:{label:'CEL',group:'reg',rate:1.25,ceiling:15300},
  pel:{label:'PEL',group:'reg',rate:2,ceiling:61200},
  livret:{label:'Livret bancaire',group:'reg',rate:0,ceiling:0},
  av:{label:'Assurance vie',group:'inv',rate:0,ceiling:0},
  per:{label:'PER',group:'inv',rate:0,ceiling:0},
  cto:{label:'Compte-titres',group:'inv',rate:0,ceiling:0},
  crypto:{label:'Crypto',group:'inv',rate:0,ceiling:0},
  courant:{label:'Compte courant',group:'other',rate:0,ceiling:0},
  pro:{label:'Compte pro',group:'other',rate:0,ceiling:0},
  immo:{label:'Immobilier',group:'other',rate:0,ceiling:0},
  autre:{label:'Autre',group:'other',rate:0,ceiling:0}
};
const initials=n=>{const w=String(n).split(/[\s\-]+/).map(x=>x.replace(/[^A-Za-zÀ-ÿ0-9]/g,'')).filter(Boolean);return ((w.length>1?w[0][0]+w[1][0]:(w[0]||'€').slice(0,2))).toUpperCase()};
const GROUPS={reg:'Livrets',inv:'Placements',other:'Autres avoirs'};

/* ---------- données ---------- */
function seed(){
  const t=iso(), m1=iso(new Date(Date.now()-31*864e5));
    return {v:1,created:t,
    profile:{goal:100000,goalDate:'2036-12-31',monthly:200,expenses:0},
    pea:{openDate:'',depositsBase:0,cash:0,lines:[]},
    accounts:[],moves:[],snaps:[],settings:{}};
}
let S;
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.pea&&o.accounts)return o}}catch(e){}return null}
function save(){snapshot();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Impossible d’enregistrer sur ce téléphone')}}

/* ---------- calculs ---------- */
const lineVal=l=>(+l.qty||0)*(+l.price||0);
const linesValue=()=>S.pea.lines.reduce((a,l)=>a+lineVal(l),0);
const peaValue=()=>linesValue()+(+S.pea.cash||0);
const accTotal=f=>S.accounts.filter(f||(()=>true)).reduce((a,x)=>a+(+x.balance||0),0);
const total=()=>peaValue()+accTotal();
const peaDeposits=()=>(+S.pea.depositsBase||0)+S.moves.filter(m=>m.acc==='pea').reduce((a,m)=>a+m.amount,0);
const tsum=()=>S.pea.lines.reduce((a,l)=>a+(+l.target||0),0);
const tw=l=>{const t=tsum();return t>0?(+l.target||0)/t:1/Math.max(1,S.pea.lines.length)};
const accType=a=>TYPES[a.type]||TYPES.autre;
const interestYear=()=>S.accounts.reduce((a,x)=>a+(+x.balance||0)*(+x.rate||0)/100,0);
const safetyMonths=()=>S.profile.expenses>0?accTotal(a=>accType(a).group==='reg')/S.profile.expenses:0;
const monthIn=(m=mk())=>S.moves.filter(x=>x.amount>0&&x.d.slice(0,7)===m).reduce((a,x)=>a+x.amount,0);
const peaAgeMonths=()=>{if(!S.pea.openDate)return -1;return Math.max(0,monthsBetween(new Date(S.pea.openDate),new Date()))};
const goalProg=()=>S.profile.goal>0?Math.min(1,total()/S.profile.goal):0;
function entityColor(id){if(id==='pea')return SERIES[0];const i=S.accounts.findIndex(a=>a.id===id);return i>=0&&i+1<=6?SERIES[i+1]:OTHER}
function prevSnap(){const m=mk();return S.snaps.filter(s=>s.m<m).pop()}
function snapshot(){const m=mk(),acc={};S.accounts.forEach(a=>acc[a.id]=+a.balance||0);const s={m,total:r2(total()),pea:r2(peaValue()),acc};const i=S.snaps.findIndex(x=>x.m===m);if(i>=0)S.snaps[i]=s;else S.snaps.push(s);S.snaps.sort((a,b)=>a.m<b.m?-1:1)}
function streak(){const set=new Set(S.moves.filter(m=>m.amount>0).map(m=>m.d.slice(0,7)));const d=new Date();d.setDate(1);if(!set.has(mk(d)))d.setMonth(d.getMonth()-1);let n=0;while(set.has(mk(d))){n++;d.setMonth(d.getMonth()-1)}return n}
function trend(l){const h=l.history||[];if(h.length<2)return null;const lim=iso(new Date(Date.now()-30*864e5));let ref=null;for(const p of h){if(p.d<=lim)ref=p}if(!ref)ref=h[0];if(ref===h[h.length-1]||!ref.p)return null;return l.price/ref.p-1}
function recordPrice(l,p){l.history=l.history||[];const d=iso(),h=l.history;if(h.length&&h[h.length-1].d===d)h[h.length-1].p=p;else h.push({d,p});if(h.length>150)h.splice(0,h.length-150)}
function peaBalanced(){const LV=linesValue();if(!LV||!S.pea.lines.length)return false;return S.pea.lines.every(l=>Math.abs(lineVal(l)/LV-tw(l))<=0.015)}
function expectedRate(){const P=peaValue();let w=P,s=P*0.07;S.accounts.forEach(a=>{const b=+a.balance||0;w+=b;s+=b*(+a.rate||0)/100});return w>0?s/w:0.07}
function fv(P,m,r,months){const i=Math.pow(1+r,1/12)-1;if(!i)return P+m*months;const g=Math.pow(1+i,months);return P*g+m*(g-1)/i}
function needMonthly(G,P,r,n){if(n<=0)return null;const i=Math.pow(1+r,1/12)-1,g=Math.pow(1+i,n);const v=i?(G-P*g)*i/(g-1):(G-P)/n;return Math.max(0,v)}

/* rééquilibrage sans vente : euros puis parts entières */
function rebalancePlan(amount){
  const L=S.pea.lines.filter(l=>l.price>0),V=linesValue(),N=V+amount;
  const rows=L.map(l=>({l,t:tw(l),v:lineVal(l)}));
  rows.forEach(r=>r.def=Math.max(0,r.t*N-r.v));
  const D=rows.reduce((a,r)=>a+r.def,0);
  rows.forEach(r=>{r.eur=D<=0?amount*r.t:(D>=amount?amount*r.def/D:r.def+(amount-D)*r.t);r.frac=r.eur/r.l.price;r.n=Math.floor(r.frac+1e-9)});
  let left=amount-rows.reduce((a,r)=>a+r.n*r.l.price,0);
  for(let k=0;k<500;k++){
    let best=null,bd=0;
    rows.forEach(r=>{if(r.l.price<=left+1e-9){const d=r.t*N-(r.v+r.n*r.l.price);if(d>bd){bd=d;best=r}}});
    if(!best||bd<best.l.price*0.5)break;best.n++;left-=best.l.price;
  }
  const spent=rows.reduce((a,r)=>a+r.n*r.l.price,0);
  return {rows,spent,left:amount-spent,amount};
}

/* ---------- graphiques (SVG maison) ---------- */
function niceStep(range,count){if(range<=0)return 1;const raw=range/count,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return (f<1.5?1:f<3?2:f<7?5:10)*p}
function lineChart(el,labels,series,o={}){
  const W=Math.max(260,el.clientWidth||320),H=o.h||180,pl=o.pl??44,pr=o.pr??12,pt=14,pb=24;
  const n=labels.length,all=series.flatMap(s=>s.values);
  let mn=Math.min(...all),mx=Math.max(...all);
  if(o.zero)mn=0;
  if(mx===mn){mx=mx*1.1||1;if(!o.zero)mn=mn*0.9}
  else if(!o.zero){const p=(mx-mn)*.18;mn=Math.max(0,mn-p);mx+=p*.5}
  const st=niceStep(mx-mn,3);mn=Math.floor(mn/st)*st;mx=Math.ceil(mx/st)*st;
  const iw=W-pl-pr,ih=H-pt-pb;
  const X=i=>pl+(n<=1?iw/2:i*iw/(n-1)),Y=v=>pt+(1-(v-mn)/((mx-mn)||1))*ih;
  let g='';
  for(let v=mn;v<=mx+st/2;v+=st){const y=Y(v).toFixed(1);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,${v===mn?.12:.06})"/><text x="${pl-8}" y="${+y+3.5}" text-anchor="end">${short(v)}</text>`}
  const k=Math.min(n,o.xticks||4);
  for(let j=0;j<k;j++){const i=k===1?0:Math.round(j*(n-1)/(k-1));const anc=k>1&&j===0?'start':k>1&&j===k-1?'end':'middle';g+=`<text x="${X(i).toFixed(1)}" y="${H-5}" text-anchor="${anc}">${labels[i]}</text>`}
  let body='';
  series.forEach(s=>{
    const d=s.values.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
    if(s.area){const gid='g'+uid();body+=`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".30"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${X(n-1).toFixed(1)},${Y(mn).toFixed(1)}L${X(0).toFixed(1)},${Y(mn).toFixed(1)}Z" fill="url(#${gid})"/>`}
    body+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dash?' stroke-dasharray="4 5"':''}/>`;
  });
  if(o.endDot)series.forEach(s=>{if(!s.dash)body+=`<circle cx="${X(n-1).toFixed(1)}" cy="${Y(s.values[n-1]).toFixed(1)}" r="4.5" fill="${s.color}" stroke="#161617" stroke-width="2"/>`});

function drawRebalance(){
  const el=$('#rbOut');if(!el)return;

function drawBars(){

  barChart(el,items,{aria:'Versements par mois',tip:x=>`${MONTHS_L[+x.m.slice(5)-1]} ${x.m.slice(0,4)}<br><b>${eur(x.v,0)}</b>`});
}
function drawProjection(){
  const el=$('#projOut');if(!el)return;
  const m=UI.projMonthly??S.profile.monthly??0,N=UI.horizon,P0=peaValue();
  const sc=[{name:'Favorable',r:.09,color:SERIES[2]},{name:'Moyen',r:.07,color:SERIES[1]},{name:'Prudent',r:.04,color:SERIES[0]}];
  const yrs=[...Array(N+1).keys()];
  const series=sc.map(s=>({name:s.name,color:s.color,values:yrs.map(y=>fv(P0,m,s.r,y*12))}));
  const dep=yrs.map(y=>P0+m*12*y);
  series.push({name:'Versé',color:'#8a8a84',values:dep,dash:true});
  el.innerHTML=`<div class="chart" id="projChart"></div>
  <div class="legend" style="margin-top:6px">${series.map(s=>`<div class="lg" style="grid-template-columns:auto 1fr auto"><span class="sw" style="background:${s.color};margin:0"></span><span>${s.name}${s.dash?'':` <span class="faint tiny">${NF0.format(sc.find(x=>x.name===s.name).r*100)} %/an</span>`}</span><span class="vv">${eur(s.values[N],0)}</span></div>`).join('')}</div>
  <div class="note">Dans ${N} ans, avant inflation (≈ 2 %/an) et avant prélèvements sociaux (17,2 % sur les gains au retrait). Hypothèses, pas des promesses.</div>`;
  lineChart($('#projChart'),yrs.map(y=>y?`+${y} a`:'auj.'),series,{h:200,pr:70,direct:true,endDot:true,xticks:3,aria:'Projection du PEA',tip:i=>`<div>Dans ${i} an${i>1?'s':''}</div>${series.map(s=>`<div class="k"><span class="sw" style="background:${s.color};margin:0"></span>${s.name} <b style="margin-left:auto;padding-left:10px">${eur(s.values[i],0)}</b></div>`).join('')}`});
}

    <div class="f2">${field('Versement prévu / mois','monthly',nv(p.monthly||''),'text','num')}${field('Dépenses / mois','expenses',nv(p.expenses||''),'text','num placeholder="pour l’épargne de sécurité"')}</div>
    <button class="btn" data-act="saveSettings">Enregistrer</button>
    <div class="sh-sub">Cours automatiques</div>
    <button class="btn ghost sm" data-act="priceSource">${S.settings.priceUrl?'✓ Google Sheets connecté · modifier':'⚡ Connecter mon Google Sheet'}</button>
    <div class="sh-sub">Historique du patrimoine</div>
    <div class="muted small" style="margin:0 2px 10px">Ajoute tes mois passés pour remplir ta courbe tout de suite.</div>
    <div class="f2">${field('Mois','hm','','month')}${field('Patrimoine total (€)','hv','','text','num')}</div>
    <button class="btn ghost" data-act="addSnap">+ Ajouter ce mois</button>
    <div style="margin-top:10px">${snaps.map(s=>`<div class="mv" style="grid-template-columns:1fr auto auto"><span>${MONTHS_L[+s.m.slice(5)-1]} ${s.m.slice(0,4)}</span><b>${eur(s.total,0)}</b>${s.m===mk()?'<span class="faint tiny" style="width:30px;text-align:center">auto</span>':`<button class="del" data-act="delSnap" data-v="${s.m}">✕</button>`}</div>`).join('')}</div>
    <div class="sh-sub">Mes données</div>
    <div class="muted small" style="margin:0 2px 10px">Tout reste sur ce téléphone, rien n’est envoyé nulle part. Fais une sauvegarde de temps en temps.</div>
    <div class="btns"><button class="btn ghost sm" data-act="export">Exporter</button><button class="btn ghost sm" data-act="import">Importer</button></div>
    <button class="btn ghost sm" data-act="install" style="margin-top:10px">Installer sur l’écran d’accueil</button>
    <button class="btn danger sm" data-act="reset" style="margin-top:10px">Tout effacer</button>`);
}
function openPriceSource(){
  const L=S.pea.lines,url=S.settings.priceUrl||'';
  const tab='Ticker\tCours\n'+L.map((l,i)=>`${sheetT(l.ticker)}\t=GOOGLEFINANCE(A${i+2})`).join('\n');
  openSheet('Cours automatiques',`
    <div class="muted small" style="margin:-4px 2px 6px">L’app va lire tes cours dans un petit onglet de ton Google Sheet, à chaque ouverture. Retard d’environ 20 minutes, comme dans Google Sheets.</div>
    <ol class="steps">
      <li>Crée un <b>nouveau Google Sheet</b> rien que pour les cours (le plus sûr), ou un onglet <b>Cours</b> dans le tien.</li>
      <li>Remplis-le comme ceci (colonne A = ticker, colonne B = formule) :</li>
    </ol>
    <div class="code">${esc(tab).replace(/\t/g,'   ')}</div>
    <button class="btn ghost sm" data-act="copyTab">Copier ce tableau</button>
    <ol class="steps" start="3" style="margin-top:12px">
      <li><b>Fichier → Partager → Publier sur le Web</b>. Choisis l’onglet des cours (pas « Document entier ») et le format <b>CSV</b>, puis <b>Publier</b>.</li>
      <li>Copie le lien obtenu et colle-le ici :</li>
    </ol>
    ${field('Lien CSV publié','purl',url,'url','placeholder="https://docs.google.com/spreadsheets/d/e/…/pub?…output=csv" autocapitalize="off" autocorrect="off"')}
    <button class="btn" data-act="savePriceSource">Enregistrer et tester</button>
    <div id="psOut" style="margin-top:12px"></div>
    ${url?'<button class="btn danger sm" data-act="clearPriceSource" style="margin-top:6px">Déconnecter</button>':''}
    <div class="note">Seul ce qui est publié devient public : n’y mets <b>ni quantités ni montants</b>. Tes données restent sur ton téléphone. Si tu ajoutes une ligne au PEA, ajoute aussi son ticker dans l’onglet.</div>`);
}
function openInstall(){
  openSheet('Installer sur ton iPhone',`<ol class="steps">
    <li>Ouvre cette page dans <b>Safari</b>.</li>
    <li>Touche le bouton <b>Partager</b> (carré avec une flèche).</li>
    <li>Choisis <b>« Sur l’écran d’accueil »</b>, puis <b>Ajouter</b>.</li>
    <li>Ouvre l’app depuis la nouvelle icône : elle s’affiche en plein écran, comme une vraie app.</li></ol>
    <div class="note" style="margin-top:14px">Les données de l’app installée sont propres à l’icône. Exporte une sauvegarde de temps en temps (Réglages → Exporter).</div>`);
}

/* ---------- actions ---------- */
const ACT={
  tab:(id,el)=>{UI.tab=el.dataset.v;render();window.scrollTo(0,0)},
  seg:(id,el)=>{const k=el.dataset.k,v=el.dataset.v;UI[k]=k==='horizon'?+v:v;if(k==='horizon'){$$('.seg button[data-k="horizon"]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));drawProjection()}else{$$('.seg button[data-k="'+k+'"]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));drawHistory()}},
  closeSheet:()=>closeSheet(),
  settings:()=>openSettings(),
  checkin:()=>openCheckin(false),
  prices:()=>openCheckin(true),
  newMove:()=>openMove(),
  newLine:()=>openLine(),
  editLine:id=>openLine(id),
  newAcc:()=>openAcc(),
  editAcc:id=>openAcc(id),
  peaSettings:()=>openPeaSettings(),
  install:()=>openInstall(),
  priceSource:()=>openPriceSource(),
  refreshPrices:async()=>{const r=await fetchPrices(true);if(r&&!r.error)render()},
  copyTab:async()=>{const t='Ticker\tCours\n'+S.pea.lines.map((l,i)=>`${sheetT(l.ticker)}\t=GOOGLEFINANCE(A${i+2})`).join('\n');try{await navigator.clipboard.writeText(t);toast('Tableau copié ✓')}catch(e){toast('Copie impossible : recopie-le à la main')}},
  savePriceSource:async()=>{const u=fv$('purl').trim();if(!/^https:\/\//.test(u))return toast('Colle le lien qui commence par https://');S.settings.priceUrl=u;save();const out=$('#psOut');if(out)out.innerHTML='<div class="muted small">Test en cours…</div>';const r=await fetchPrices(false);render();if(!out||!out.isConnected)return;if(!r||r.error){out.innerHTML=`<div class="cta" style="border-color:rgba(208,59,59,.5);background:rgba(208,59,59,.06);text-align:left">Impossible de lire ce lien. Vérifie que tu as bien choisi <b>CSV</b> et l’onglet <b>Cours</b> dans « Publier sur le Web », et que ton téléphone est connecté.</div>`;return}out.innerHTML=`<div class="cta" style="text-align:left"><b>✓ ${r.n}/${S.pea.lines.length} lignes mises à jour</b>${r.miss.length?`<br>Pas trouvé : ${r.miss.map(esc).join(', ')}. Vérifie que le ticker de la ligne (ex : ESE) correspond à celui du Sheet (ex : EPA:ESE).`:'<br>Tes cours se mettront à jour à chaque ouverture de l’app.'}</div>`},
  clearPriceSource:()=>{S.settings.priceUrl='';S.settings.lastFetch=0;closeSheet();commit('Cours auto déconnectés')},
  goRb:()=>{UI.tab='pea';render();setTimeout(()=>{const r=$('#rb');if(r)window.scrollTo({top:r.getBoundingClientRect().top+window.scrollY-90,behavior:'smooth'});setTimeout(()=>{const i=$('#rbAmt');if(i)i.focus()},450)},60)},
  badge:(id,el)=>{const b=BADGES[+el.dataset.v];toast(`${b.e} ${b.d}${b.ok()?' ✓':''}`)},
  saveLine:id=>{
    const name=fv$('name').trim();if(!name)return toast('Donne un nom à la ligne');
    const price=num(fv$('price'));let l=id?S.pea.lines.find(x=>x.id===id):null;
    if(!l){l={id:uid(),history:[]};S.pea.lines.push(l)}
    Object.assign(l,{name,ticker:fv$('ticker').trim().toUpperCase(),qty:num(fv$('qty')),price,pru:num(fv$('pru')),target:num(fv$('target'))});
    if(price>0)recordPrice(l,price);closeSheet();commit('Ligne enregistrée');
  },
  delLine:id=>{if(!confirm('Supprimer cette ligne ?'))return;S.pea.lines=S.pea.lines.filter(l=>l.id!==id);closeSheet();commit('Ligne supprimée')},
  saveAcc:id=>{
    const name=fv$('name').trim();if(!name)return toast('Donne un nom au compte');
    let a=id?S.accounts.find(x=>x.id===id):null;if(!a){a={id:uid(),created:iso()};S.accounts.push(a)}
    Object.assign(a,{type:fv$('type'),name,balance:r2(num(fv$('balance'))),rate:num(fv$('rate')),ceiling:num(fv$('ceiling'))});
    closeSheet();commit('Compte enregistré');
  },
  delAcc:id=>{if(!confirm('Supprimer ce compte ? Son historique de mouvements restera visible.'))return;S.accounts=S.accounts.filter(a=>a.id!==id);closeSheet();commit('Compte supprimé')},
  quickMove:(id,el)=>{const amt=num(fv$('qamt'));if(amt<=0)return toast('Indique un montant');const s=+el.dataset.v,a=S.accounts.find(x=>x.id===id);a.balance=r2((+a.balance||0)+s*amt);S.moves.push({id:uid(),d:iso(),acc:id,amount:s*amt,note:''});closeSheet();commit(s>0?'Versement enregistré 🔥':'Retrait enregistré')},
  saveMove:()=>{
    const amt=num(fv$('amount'));if(amt<=0)return toast('Indique un montant');
    const s=+fv$('kind'),acc=fv$('acc'),d=fv$('date')||iso();
    if(acc==='pea')S.pea.cash=r2((+S.pea.cash||0)+s*amt);else{const a=S.accounts.find(x=>x.id===acc);if(a)a.balance=r2((+a.balance||0)+s*amt)}
    S.moves.push({id:uid(),d,acc,amount:s*amt,note:fv$('note').trim()});closeSheet();commit(s>0?'Versement enregistré 🔥':'Retrait enregistré');
  },
  delMove:id=>{const m=S.moves.find(x=>x.id===id);if(!m||!confirm('Supprimer ce mouvement ? Le solde du compte sera ajusté.'))return;if(m.acc==='pea')S.pea.cash=r2((+S.pea.cash||0)-m.amount);else{const a=S.accounts.find(x=>x.id===m.acc);if(a)a.balance=r2((+a.balance||0)-m.amount)}S.moves=S.moves.filter(x=>x.id!==id);commit('Mouvement supprimé')},
  saveCheckin:()=>{
    $$('#sheet [data-price]').forEach(i=>{const l=S.pea.lines.find(x=>x.id===i.dataset.price),p=num(i.value);if(l&&p>0){l.price=p;recordPrice(l,p)}});
    const c=$('#sheet [data-cash]');if(c)S.pea.cash=r2(num(c.value));
    $$('#sheet [data-bal]').forEach(i=>{const a=S.accounts.find(x=>x.id===i.dataset.bal);if(a)a.balance=r2(num(i.value))});
    closeSheet();commit('Bilan enregistré ✓');
  },
  savePea:()=>{S.pea.openDate=fv$('openDate');S.pea.depositsBase=num(fv$('depositsBase'));S.pea.cash=r2(num(fv$('cash')));closeSheet();commit('PEA mis à jour')},
  applyRb:()=>{
    const p=UI.plan;if(!p||p.spent<=0)return;
    const dep=$('#rbDep');if(dep&&dep.checked){const add=r2(p.amount-(+S.pea.cash||0));if(add>0){S.pea.cash=r2((+S.pea.cash||0)+add);S.moves.push({id:uid(),d:iso(),acc:'pea',amount:add,note:'Versement PEA'})}}
    p.rows.forEach(r=>{if(!r.n)return;const l=S.pea.lines.find(x=>x.id===r.l.id);if(!l)return;const q0=+l.qty||0;if(l.pru>0||q0===0)l.pru=r2(((q0*(l.pru||0))+r.n*l.price)/(q0+r.n));l.qty=q0+r.n;S.pea.cash=r2((+S.pea.cash||0)-r.n*l.price);recordPrice(l,l.price)});
    UI.rbAmount=null;UI.plan=null;commit('Achats enregistrés ✓');
  },
  saveSettings:()=>{Object.assign(S.profile,{goal:num(fv$('goal')),goalDate:fv$('goalDate'),monthly:num(fv$('monthly')),expenses:num(fv$('expenses'))});UI.projMonthly=null;closeSheet();commit('Réglages enregistrés')},
  addSnap:()=>{const m=fv$('hm'),v=num(fv$('hv'));if(!/^\d{4}-\d{2}$/.test(m)||v<=0)return toast('Choisis un mois et un montant');if(m>=mk())return toast('Choisis un mois passé');const i=S.snaps.findIndex(s=>s.m===m),s={m,total:r2(v),manual:true};if(i>=0)S.snaps[i]=s;else S.snaps.push(s);S.snaps.sort((a,b)=>a.m<b.m?-1:1);save();render();openSettings();toast('Mois ajouté')},
  delSnap:(id,el)=>{S.snaps=S.snaps.filter(s=>s.m!==el.dataset.v);save();render();openSettings()},
  export:async()=>{const name=`patrimoine-${iso()}.json`,file=new File([JSON.stringify(S,null,1)],name,{type:'application/json'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Sauvegarde Patrimoine'});return}}catch(e){if(e.name==='AbortError')return}const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove()},
  import:()=>$('#importFile').click(),
  reset:()=>{if(!confirm('Effacer toutes tes données ? (fais d’abord une sauvegarde)'))return;if(!confirm('Vraiment tout effacer ?'))return;S=seed();closeSheet();commit('Données effacées')}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t&&t.closest('.tabbar')){UI.tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  const a=e.target.closest('[data-act]');if(!a)return;
  if(a.matches('input,select,label'))return;
  const f=ACT[a.dataset.act];if(f){e.preventDefault();f(a.dataset.id,a,e)}
});
$('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!o||!o.pea||!o.accounts)throw 0;if(!confirm('Remplacer tes données actuelles par cette sauvegarde ?'))return;S=o;S.moves=S.moves||[];S.snaps=S.snaps||[];S.settings=S.settings||{};closeSheet();commit('Sauvegarde importée ✓')}catch(_){toast('Fichier de sauvegarde invalide')}e.target.value=''});

/* ---------- démarrage ---------- */
(function init(){
  S=load();if(!S){S=seed();save()}else{S.moves=S.moves||[];S.snaps=S.snaps||[];save()}
  S.settings=S.settings||{};
  const d=new Date();const hs=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});$('#hello').textContent=hs.charAt(0).toUpperCase()+hs.slice(1);
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  render();
  const auto=()=>{if(S.settings.priceUrl&&Date.now()-(S.settings.lastFetch||0)>5*60*1000)fetchPrices(false).then(r=>{if(r&&!r.error&&$('#sheet').hidden)render()})};
  auto();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')auto()});
  let rw=window.innerWidth,rt;window.addEventListener('resize',()=>{if(window.innerWidth===rw)return;rw=window.innerWidth;clearTimeout(rt);rt=setTimeout(render,150)});
})();
</script>
</body>
